name: Validate template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify skill mirrors
        run: python scripts/sync_skills.py --check
      - name: Test Persian-writing toolkit
        run: python -B -m unittest discover -s .agents/skills/persian-writing/tests
      - name: Install Typst
        run: |
          bash scripts/cloud-setup.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile starter and regression examples
        run: python scripts/build.py --examples
